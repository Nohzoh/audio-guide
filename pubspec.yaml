name: audiolens
description: AudioLens - AI-powered audio guide
publish_to: 'none'
version: 0.14.1+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  characters: ^1.3.0
  provider: ^6.1.1
  shared_preferences: ^2.3.0
  url_launcher: ^6.2.2
  http: ^1.2.0
  flutter_secure_storage: ^11.0.0
  path_provider: ^2.1.2
  flutter_animate: ^4.5.0
  google_fonts: ^8.2.1
  image_picker: ^1.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  intl: ^0.20.2
  gal: ^2.3.0
  exif: ^3.3.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  flutter_tts: ^4.2.5
  dio: ^5.11.0
  flutter_local_notifications: ^22.3.0
  package_info_plus: ^10.2.1
  image: ^4.9.2
  cryptography: ^2.7.0
  in_app_update: ^5.0.0
  flutter_localizations:
    sdk: flutter
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4
  share_plus_platform_interface: ^7.2.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    # #299: bundled as app assets (not just Play Console metadata) so the
    # in-app "what's new" dialog can show the same text without a third
    # copy of release notes to maintain — see HomeScreen's whats-new
    # check and the `ship` skill, which already writes these every
    # release.
    - distribution/whatsnew/whatsnew-fr-FR
    - distribution/whatsnew/whatsnew-en-US
