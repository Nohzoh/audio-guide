name: Detect code changes

# #388: shared by test.yml and build-android.yml, which both used to
# carry their own independently-maintained copy of this exact job — a
# real drift already happened because of that duplication (a Dependabot
# PR's merge-ref kept the pre-#382 vulnerable version of this logic
# simply because nobody had touched that specific copy). One definition,
# called by both, so a fix here reaches both workflows at once.
on:
  workflow_call:
    outputs:
      code:
        description: "true if this push/PR touches anything besides docs/benchmark-only files"
        value: ${{ jobs.changes.outputs.code }}
      release:
        description: >-
          #389: true if this push's commit actually bumped pubspec.yaml's
          version line (a real release, per the ship skill's
          chore/publish-v* PRs) — always true for workflow_dispatch,
          meaningless for pull_request (build-android.yml never builds
          the AAB there regardless of this value).
        value: ${{ jobs.changes.outputs.release }}

jobs:
  # Decides whether the caller's real job is needed. Deliberately does
  # NOT use paths-ignore on the caller workflows' own triggers: "build"
  # and "test" are required status checks (branch protection), and a
  # workflow that never triggers at all leaves a required check
  # permanently "Expected", blocking merges forever. A job that runs and
  # reports "skipped" satisfies a required check — that's the mechanism
  # this relies on.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - name: Checkout code
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          # #389: needs HEAD^1 (the pre-merge state of the target branch)
          # to diff pubspec.yaml's version line against, to tell a real
          # release push apart from any other push to main. Depth 1
          # (the default) only has HEAD itself.
          fetch-depth: 2

      - name: List changed files
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: json
          filters: |
            all:
              - '**'

      - name: Decide
        id: decide
        env:
          # #382: passed via env rather than interpolated straight into the
          # script below — a changed file's name is attacker-controlled
          # (anyone opening a PR picks their own file names), and this job
          # runs on `push` to main, a privileged trigger with write access
          # to the default-branch cache scope. Interpolating it directly
          # let a crafted file name inject arbitrary shell syntax (CodeQL
          # actions/cache-poisoning/code-injection).
          ALL_FILES: ${{ steps.filter.outputs.all_files }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Plain bash rather than relying on dorny/paths-filter's own
          # pattern combination: its patterns within one filter are OR'd
          # together (default 'some' mode), so multiple '!pattern' entries
          # in the same list don't chain into an AND-exclusion the way
          # .gitignore does — each negation independently matches "any
          # file that isn't X", and OR-ing several such broad negations
          # ends up matching almost everything. The 'every' mode requires
          # ALL patterns to match a single file simultaneously, which
          # doesn't fit multiple unrelated positive folders (a file can't
          # be under lib/** AND android/** at once) either. Fetching the
          # full changed-file list and filtering it explicitly here
          # avoids both pitfalls.
          CODE=false
          echo "$ALL_FILES" | jq -r '.[]' > /tmp/changed_files.txt
          while IFS= read -r f; do
            case "$f" in
              *.md|benchmark/*|docs/*|.github/workflows/benchmark.yml) ;;
              *) echo true > /tmp/code_flag ;;
            esac
          done < /tmp/changed_files.txt
          [ -f /tmp/code_flag ] && CODE=true
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

          # #389: a "release" push is specifically one where pubspec.yaml's
          # version: line changed — the AAB is only ever consumed by the
          # publish workflow after a chore/publish-v* version-bump merge,
          # never by a routine merge to main. Everything else (including a
          # non-version pubspec.yaml edit, e.g. a dependency bump) skips
          # the signed build entirely.
          RELEASE=false
          if [ "${{ github.event_name }}" = "push" ] && echo "$ALL_FILES" | jq -e 'index("pubspec.yaml")' > /dev/null; then
            OLD_VERSION=$(git show HEAD^1:pubspec.yaml | grep '^version:' || true)
            NEW_VERSION=$(grep '^version:' pubspec.yaml || true)
            if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
              RELEASE=true
            fi
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
