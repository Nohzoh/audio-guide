name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # #387: no `track` input here anymore — this workflow only ever builds
  # now, never publishes. Use publish-play-store.yml's own
  # workflow_dispatch to actually publish a build it produced.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # #388: shared with test.yml — see changes.yml. The caller must
  # explicitly grant at least what the reusable workflow's own job
  # requests (pull-requests: read) — GitHub validates this at the
  # workflow-file level and refuses to even schedule a run otherwise
  # (learned the hard way: a bare `uses:` here with no permissions block
  # produced a hard "not valid" startup_failure, not a runtime error).
  changes:
    permissions:
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  build:
    needs: changes
    # #389: on a push to main, the signed AAB is only ever consumed by a
    # real release (a chore/publish-v* version-bump merge) — every other
    # push to main skips the whole job (SDK setup, patches, keystore,
    # build) via the same "job runs and reports skipped satisfies a
    # required check" mechanism the `code` gate already relies on.
    # pull_request/workflow_dispatch entry is unaffected — `release` is
    # only meaningful for `push` (see changes.yml).
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || needs.changes.outputs.release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Free disk space
        run: scripts/ci/free_disk_space.sh

      # #386: pinned to an exact patch rather than the floating '17' this
      # used to be — a silently-updated JDK patch is exactly the kind of
      # "changed underneath us without anyone touching this file" risk
      # this review is trying to reduce. Bump deliberately when there's a
      # reason to (a real security update, a new Flutter SDK requirement).
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17.0.20'

      # #386: packages: '' skips the action's own default install
      # (cmdline-tools + platform-tools) beyond bootstrapping sdkmanager
      # itself — platform-tools (adb/fastboot) is never used in this CI
      # build (no device/emulator involved), and the exact
      # platform/build-tools/NDK versions actually needed are installed
      # explicitly right below anyway.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # T83: NDK is a multi-GB download re-fetched on every run otherwise.
      # Bump the key's version suffix if the pinned NDK version below changes.
      - name: Cache Android NDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}/ndk
          key: ${{ runner.os }}-ndk-28.2.13676358

      - name: Install Android SDK 37 + NDK 27
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358"

      - name: Setup Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      # T83: ~/.pub-cache and Gradle's caches/wrapper are cold on every run
      # today because android/ isn't committed (see bootstrap step below).
      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Bootstrap: Re-generate Android project files (not versioned in repo)
      # Required because android/ folder is not committed (only Flutter code is versioned)
      # This ensures we always build with latest Flutter Android embedding (v2) and clean state
      - name: Bootstrap Flutter project
        run: flutter create --project-name audiolens --org io.nohzoh --platforms android . 2>&1 | head -20 || true

      - name: Show pubspec after bootstrap
        run: head -30 pubspec.yaml

      # The patching steps below are extracted into scripts/ci/ (rather than
      # inline here) purely to keep this workflow file short and each
      # patch independently readable/testable â€” no change in behavior.
      - name: Patch build.gradle.kts
        run: scripts/ci/patch_build_gradle.sh

      - name: Patch Kotlin version
        run: scripts/ci/patch_kotlin_version.sh

      - name: Patch AndroidManifest
        run: scripts/ci/patch_android_manifest.sh

      - name: Add FileProvider
        run: scripts/ci/add_file_provider.sh

      # #390: a pull_request build only ever needs to prove it *can* sign
      # a release build (non-debuggable, R8, etc.) — never the real
      # production key, which only push (to main) and workflow_dispatch
      # actually need. Picks the throwaway CI-only key on pull_request,
      # the real one otherwise. This closes the same gap #382's follow-up
      # closed for Dependabot specifically (whose PRs can't see regular
      # Actions secrets at all) — but any other same-repo PR still had
      # normal access to the real key until now.
      - name: Setup keystore
        run: |
          echo "${{ github.event_name == 'pull_request' && secrets.CI_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/audiolens.jks
          cat > android/key.properties << EOF
          storeFile=audiolens.jks
          storePassword=${{ github.event_name == 'pull_request' && secrets.CI_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ github.event_name == 'pull_request' && secrets.CI_KEY_ALIAS || secrets.KEY_ALIAS }}
          keyPassword=${{ github.event_name == 'pull_request' && secrets.CI_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          EOF
          echo "âœ… Keystore ready"

      - name: Patch signing in build.gradle.kts
        run: |
          FILE="android/app/build.gradle.kts"
          [ ! -f "$FILE" ] && FILE="android/app/build.gradle"
          python3 scripts/patch_signing.py "$FILE"
          echo "Done"

      - name: Get dependencies
        run: flutter pub get 2>&1 | tee /tmp/pub_get.txt && cat /tmp/pub_get.txt | tail -30

      # #294: XOR-obfuscates the Telegram secrets (hex-encoded) before
      # they're embedded via --dart-define below, instead of passing the
      # raw values — defeats a naive `strings`/regex scan of the compiled
      # APK for a recognizable Telegram-token-shaped string (see
      # feedback_service.dart's _deobfuscate, which undoes this exact
      # transform at runtime; the key must match exactly on both sides).
      # Computed once here (not duplicated in both build steps below) and
      # exported via $GITHUB_ENV so later steps in this job can read it.
      #
      # #390: skipped on pull_request — a PR's release-build sanity check
      # doesn't need working feedback-submission credentials embedded,
      # only push/workflow_dispatch builds that might actually be
      # distributed/tested do. The dart-define flags below simply embed
      # empty strings when this step didn't run, same as an unconfigured
      # local/dev build already handles.
      - name: Obfuscate Telegram secrets for embedding
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_ENV"
          import os

          KEY = "AudioLensObfuscationKeyDoNotUseElsewhere".encode()

          def obfuscate(value: str) -> str:
              data = value.encode()
              xored = bytes(b ^ KEY[i % len(KEY)] for i, b in enumerate(data))
              return xored.hex()

          print(f"TELEGRAM_BOT_TOKEN_OBF={obfuscate(os.environ.get('TELEGRAM_BOT_TOKEN', ''))}")
          print(f"TELEGRAM_CHAT_ID_OBF={obfuscate(os.environ.get('TELEGRAM_CHAT_ID', ''))}")
          PYEOF

      # The APK is only ever consumed for direct-sideload testing/manual
      # QA (e.g. via adb) or as a release-build sanity check (aapt can
      # inspect an APK, not an AAB) â€” never for the actual Play Store
      # publish, which needs the AAB below. A PR is never published, so
      # building it there is purely that sanity check; skip it on a plain
      # push to main, where the AAB is what actually matters and doing
      # both doubles the native build time (assembleRelease *and*
      # bundleRelease are separate Gradle invocations sharing the same
      # build graph) for no benefit. workflow_dispatch keeps both, since
      # that path is a full manual build+publish where having the APK for
      # a quick manual check before publishing is still useful.
      - name: Build APK (release)
        if: github.event_name != 'push'
        run: |
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # T83: only real-device ABIs â€” x86/x86_64 are emulator-only and
          # the Flutter engine (plus ML Kit GenAI's native libs, used for
          # on-device Gemini Nano) still has real native code per ABI to
          # compile/link/package.
          # T84: --build-number gives every release a strictly increasing
          # versionCode (the run number always goes up), without needing to
          # hand-edit pubspec.yaml's committed "0.1.0+1" per upload â€” Play
          # Console rejects any upload whose versionCode isn't higher than
          # the last one.
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-number="${{ github.run_number }}" \
            --dart-define=BUILD_DATE="$BUILD_DATE" \
            --dart-define=TELEGRAM_BOT_TOKEN_OBF="$TELEGRAM_BOT_TOKEN_OBF" \
            --dart-define=TELEGRAM_CHAT_ID_OBF="$TELEGRAM_CHAT_ID_OBF" \
            2>&1 | tee build_output.txt
          exit ${PIPESTATUS[0]}

      - name: Show errors on failure
        if: failure() && github.event_name != 'push'
        run: |
          echo "## Build errors" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          [ -f build_output.txt ] && tail -150 build_output.txt >> $GITHUB_STEP_SUMMARY || echo "No build output file" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify APK exists and is valid
        if: github.event_name != 'push'
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            exit 1
          fi
          # Check APK is not empty
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK is empty"
            exit 1
          fi
          # aapt isn't on PATH on this runner â€” locate it in the installed
          # build-tools instead of silently no-op'ing the checks below.
          AAPT="$(find "$ANDROID_HOME" -name aapt -type f 2>/dev/null | head -1)"
          if [ -z "$AAPT" ]; then
            echo "::error::aapt not found under \$ANDROID_HOME â€” cannot verify the APK is non-debuggable"
            exit 1
          fi
          # Show APK info
          "$AAPT" dump badging "$APK_PATH" | grep -E "package:|version|sdkVersion"
          # T79: a release build must not be debuggable
          if "$AAPT" dump badging "$APK_PATH" | grep -qi "application-debuggable"; then
            echo "::error::APK is flagged as debuggable â€” this must not ship to users"
            exit 1
          fi
          echo "âœ… APK is not debuggable"
          echo "âœ… APK build verified: $APK_PATH ($(stat -f%z "$APK_PATH" 2>/dev/null || stat -c%s "$APK_PATH") bytes)"

      - name: Upload APK
        if: success() && github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: AudioLens-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # T84: the Play Store requires a .aab, not the .apk built above (which
      # stays around for direct-sideload testing, e.g. via adb). Reuses this
      # same job's already-bootstrapped/patched android/ project and signing
      # config rather than a separate job, so it's a cheap addition.
      #
      # Skipped on pull_request: a PR is never published, so there's
      # nothing to consume the AAB for there â€” only push (main, feeds
      # publish-play-store.yml) and workflow_dispatch (full manual
      # build+publish) actually need it.
      - name: Build App Bundle (release)
        if: github.event_name != 'pull_request'
        run: |
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          flutter build appbundle --release \
            --build-number="${{ github.run_number }}" \
            --dart-define=BUILD_DATE="$BUILD_DATE" \
            --dart-define=TELEGRAM_BOT_TOKEN_OBF="$TELEGRAM_BOT_TOKEN_OBF" \
            --dart-define=TELEGRAM_CHAT_ID_OBF="$TELEGRAM_CHAT_ID_OBF" \
            2>&1 | tee build_output_aab.txt
          exit ${PIPESTATUS[0]}

      - name: Show AAB errors on failure
        if: failure() && github.event_name != 'pull_request'
        run: |
          echo "## AAB build errors" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          [ -f build_output_aab.txt ] && tail -150 build_output_aab.txt >> $GITHUB_STEP_SUMMARY || echo "No build output file" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify AAB exists
        if: github.event_name != 'pull_request'
        run: |
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -s "$AAB_PATH" ]; then
            echo "::error::AAB not found or empty at $AAB_PATH"
            exit 1
          fi
          echo "âœ… AAB build verified: $AAB_PATH ($(stat -f%z "$AAB_PATH" 2>/dev/null || stat -c%s "$AAB_PATH") bytes)"

      - name: Upload AAB
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: AudioLens-release-${{ github.sha }}-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # T98: R8 is enabled on release builds â€” upload the mapping file so
      # crash reports (Play Console, Crashlytics, etc.) can be de-obfuscated.
      # Tied to the AAB path for the same reason as the AAB itself â€” only
      # ever needed for something that might get published.
      - name: Upload R8 mapping file
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: AudioLens-release-${{ github.sha }}-mapping
          path: build/app/outputs/mapping/release/mapping.txt
          retention-days: 30

      # #387: this workflow never publishes — see publish-play-store.yml,
      # which downloads and republishes the AAB/mapping artifacts this job
      # just uploaded, instead of rebuilding. Keeping the two apart means
      # a `workflow_dispatch` run of *this* file (a plain build, a
      # diagnostic, anything) can never accidentally reach the Play Store
      # — it structurally has no path to it. Publishing a genuinely fresh
      # build (no recent artifact on main to reuse) is now two explicit
      # steps: dispatch this workflow to build, then dispatch
      # publish-play-store.yml with that run's ID to publish it.
