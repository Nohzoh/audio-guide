name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # See build-android.yml's "changes" job for why this is a job-level skip
  # rather than paths-ignore on the trigger (a required check that never
  # triggers blocks merging forever; a skipped one satisfies it).
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - name: Checkout code
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: List changed files
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: json
          filters: |
            all:
              - '**'

      - name: Decide
        id: decide
        env:
          # #382: passed via env rather than interpolated straight into the
          # script below — a changed file's name is attacker-controlled
          # (anyone opening a PR picks their own file names), and this job
          # runs on `push` to main, a privileged trigger with write access
          # to the default-branch cache scope. Interpolating it directly
          # (as this used to) let a crafted file name inject arbitrary
          # shell syntax (CodeQL actions/cache-poisoning/code-injection).
          ALL_FILES: ${{ steps.filter.outputs.all_files }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # See build-android.yml's "changes" job for why this is plain
          # bash rather than dorny/paths-filter's own pattern combination.
          CODE=false
          echo "$ALL_FILES" | jq -r '.[]' > /tmp/changed_files.txt
          while IFS= read -r f; do
            case "$f" in
              *.md|benchmark/*|docs/*|.github/workflows/benchmark.yml) ;;
              *) echo true > /tmp/code_flag ;;
            esac
          done < /tmp/changed_files.txt
          [ -f /tmp/code_flag ] && CODE=true
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      # sqflite_common_ffi (T09, history_service_migration_test.dart) needs
      # a system SQLite lib to dlopen. Confirmed always already present on
      # ubuntu-latest (dpkg check below is a no-op offline confirmation in
      # every run so far) â€” so the common case never has to touch the
      # network at all. apt-get is only a fallback for a hypothetical
      # future runner image that doesn't ship it, and `apt-get update` has
      # been seen hanging for 40+ minutes on an unresponsive Ubuntu mirror
      # (2026-08-19) instead of failing â€” timeout-minutes plus a few quick
      # retries turns that fallback path into a fast failure/self-heal.
      - name: Install libsqlite3
        timeout-minutes: 3
        run: |
          if dpkg -s libsqlite3-0 >/dev/null 2>&1; then
            echo "libsqlite3-0 already present, skipping apt-get"
            exit 0
          fi
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y libsqlite3-0 && exit 0
            echo "apt-get attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "apt-get failed after 3 attempts"
          exit 1

      - name: Analyze
        run: flutter analyze

      # T126: cheap heuristic backstop against reintroducing a log leak
      # like the ones found in the 2026-08-19/20 security audits (GPS
      # coordinate, API key via an unsanitized exception).
      - name: Log hygiene check
        run: python3 scripts/check_log_hygiene.py

      - name: Test
        run: flutter test --coverage

      # #140: fails the build if coverage regresses below a floor, instead
      # of only having a percentage nobody looks at.
      - name: Check coverage floor
        run: python3 scripts/check_coverage.py
