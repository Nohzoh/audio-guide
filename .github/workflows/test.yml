name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # #388: shared with build-android.yml — see changes.yml. The caller
  # must explicitly grant at least what the reusable workflow's own job
  # requests (pull-requests: read) — GitHub validates this at the
  # workflow-file level and refuses to even schedule a run otherwise
  # (learned the hard way: a bare `uses:` here with no permissions block
  # produced a hard "not valid" startup_failure, not a runtime error).
  changes:
    permissions:
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      # sqflite_common_ffi (T09, history_service_migration_test.dart) needs
      # a system SQLite lib to dlopen. Confirmed always already present on
      # ubuntu-latest (dpkg check below is a no-op offline confirmation in
      # every run so far) â€” so the common case never has to touch the
      # network at all. apt-get is only a fallback for a hypothetical
      # future runner image that doesn't ship it, and `apt-get update` has
      # been seen hanging for 40+ minutes on an unresponsive Ubuntu mirror
      # (2026-08-19) instead of failing â€” timeout-minutes plus a few quick
      # retries turns that fallback path into a fast failure/self-heal.
      - name: Install libsqlite3
        timeout-minutes: 3
        run: |
          if dpkg -s libsqlite3-0 >/dev/null 2>&1; then
            echo "libsqlite3-0 already present, skipping apt-get"
            exit 0
          fi
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y libsqlite3-0 && exit 0
            echo "apt-get attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "apt-get failed after 3 attempts"
          exit 1

      - name: Analyze
        run: flutter analyze

      # T126: cheap heuristic backstop against reintroducing a log leak
      # like the ones found in the 2026-08-19/20 security audits (GPS
      # coordinate, API key via an unsanitized exception).
      - name: Log hygiene check
        run: python3 scripts/check_log_hygiene.py

      - name: Test
        run: flutter test --coverage

      # #140: fails the build if coverage regresses below a floor, instead
      # of only having a percentage nobody looks at.
      - name: Check coverage floor
        run: python3 scripts/check_coverage.py
