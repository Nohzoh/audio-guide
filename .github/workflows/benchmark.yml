name: Gemini Benchmark

# Manual only â€” this calls the real Gemini API and burns quota/cost, so
# it must never run on push/PR triggers. See benchmark/PROTOCOL.md.
on:
  workflow_dispatch:
    inputs:
      prompt_variant_id:
        description: 'Identifiant de variante (laisser "baseline" pour un run trimestriel officiel)'
        required: false
        default: 'baseline'
      model:
        description: 'ModÃ¨le Gemini Ã  tester (laisser vide = dÃ©faut de production)'
        required: false
        default: ''
      strip_location_context:
        description: 'Ignorer le contexte de localisation (test GPS vs sans GPS â€” voir PROTOCOL.md)'
        type: boolean
        required: false
        default: false
      list_models_only:
        description: 'Ignorer le jeu de donnÃ©es, juste lister les modÃ¨les Gemini disponibles aujourd''hui'
        type: boolean
        required: false
        default: false
      max_tokens:
        description: 'maxOutputTokens (laisser vide = dÃ©faut de production, 1024)'
        required: false
        default: ''
      thinking_budget:
        description: 'thinkingBudget (laisser vide = dÃ©faut de production, 512)'
        required: false
        default: ''

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run cloud benchmark
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Secret GEMINI_API_KEY manquant â€” voir benchmark/README.md pour le configurer (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          ARGS="--api-key $GEMINI_API_KEY --prompt-variant-id '${{ inputs.prompt_variant_id }}'"
          if [ "${{ inputs.list_models_only }}" = "true" ]; then
            ARGS="--api-key $GEMINI_API_KEY --list-models"
          fi
          if [ -n "${{ inputs.model }}" ]; then
            ARGS="$ARGS --model '${{ inputs.model }}'"
          fi
          if [ "${{ inputs.strip_location_context }}" = "true" ]; then
            ARGS="$ARGS --strip-location-context"
          fi
          if [ -n "${{ inputs.max_tokens }}" ]; then
            ARGS="$ARGS --max-tokens '${{ inputs.max_tokens }}'"
          fi
          if [ -n "${{ inputs.thinking_budget }}" ]; then
            ARGS="$ARGS --thinking-budget '${{ inputs.thinking_budget }}'"
          fi
          eval python3 benchmark/scripts/run_cloud_benchmark.py "$ARGS"

      - name: Upload results artifact
        if: inputs.list_models_only != true
        uses: actions/upload-artifact@v7
        with:
          name: gemini-benchmark-results-${{ github.run_id }}
          path: benchmark/results/cloud_*.json
          retention-days: 90
